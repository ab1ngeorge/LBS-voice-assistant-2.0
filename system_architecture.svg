<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640" font-family="Arial, Helvetica, sans-serif">

  <!-- White Background -->
  <rect width="720" height="640" fill="#ffffff"/>

  <!-- ============================================================ -->
  <!-- LAYER 1: CLIENT LAYER  (y: 20–100)                           -->
  <!-- ============================================================ -->
  <rect x="40" y="20" width="640" height="82" rx="2" ry="2"
        fill="#f2f2f2" stroke="#000000" stroke-width="1.0"/>
  <text x="60" y="40" font-size="11" font-weight="bold" fill="#000000">Client Layer</text>

  <rect x="80"  y="52" width="140" height="36" rx="2" ry="2"
        fill="#ffffff" stroke="#000000" stroke-width="1.0"/>
  <text x="150" y="75" font-size="10" text-anchor="middle" fill="#000000">Web Interface</text>

  <rect x="280" y="52" width="140" height="36" rx="2" ry="2"
        fill="#ffffff" stroke="#000000" stroke-width="1.0"/>
  <text x="350" y="75" font-size="10" text-anchor="middle" fill="#000000">Voice Input</text>

  <rect x="480" y="52" width="140" height="36" rx="2" ry="2"
        fill="#ffffff" stroke="#000000" stroke-width="1.0"/>
  <text x="550" y="75" font-size="10" text-anchor="middle" fill="#000000">Audio Output</text>

  <!-- ============================================================ -->
  <!-- ARROWS: Client → API  (vertical, converging)                 -->
  <!-- ============================================================ -->
  <!-- Web Interface ↓ -->
  <line x1="150" y1="88" x2="150" y2="112" stroke="#000" stroke-width="1"/>
  <line x1="150" y1="112" x2="270" y2="155" stroke="#000" stroke-width="1"/>
  <polygon points="270,155 262,150 264,157" fill="#000"/>

  <!-- Voice Input ↓ -->
  <line x1="350" y1="88" x2="350" y2="142" stroke="#000" stroke-width="1"/>
  <polygon points="350,142 346,134 354,134" fill="#000"/>

  <!-- Audio Output ↓ (dashed – output path) -->
  <line x1="550" y1="88" x2="550" y2="112" stroke="#000" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="550" y1="112" x2="460" y2="155" stroke="#000" stroke-width="1" stroke-dasharray="4,2"/>
  <polygon points="460,155 464,147 467,155" fill="#000"/>

  <!-- ============================================================ -->
  <!-- LAYER 2: API / INTERFACE LAYER  (y: 130–210)                 -->
  <!-- ============================================================ -->
  <rect x="40" y="130" width="640" height="82" rx="2" ry="2"
        fill="#e8e8e8" stroke="#000000" stroke-width="1.0"/>
  <text x="60" y="150" font-size="11" font-weight="bold" fill="#000000">API / Interface Layer</text>

  <rect x="170" y="162" width="160" height="36" rx="2" ry="2"
        fill="#ffffff" stroke="#000000" stroke-width="1.0"/>
  <text x="250" y="185" font-size="10" text-anchor="middle" fill="#000000">API Gateway</text>

  <rect x="400" y="162" width="160" height="36" rx="2" ry="2"
        fill="#ffffff" stroke="#000000" stroke-width="1.0"/>
  <text x="480" y="185" font-size="10" text-anchor="middle" fill="#000000">Request Handler</text>

  <!-- API Gateway → Request Handler -->
  <line x1="330" y1="180" x2="400" y2="180" stroke="#000" stroke-width="1"/>
  <polygon points="400,180 392,176 392,184" fill="#000"/>

  <!-- ============================================================ -->
  <!-- ARROW: API → Processing                                     -->
  <!-- ============================================================ -->
  <line x1="360" y1="212" x2="360" y2="248" stroke="#000" stroke-width="1"/>
  <polygon points="360,248 356,240 364,240" fill="#000"/>

  <!-- ============================================================ -->
  <!-- LAYER 3: PROCESSING LAYER  (y: 240–380)                     -->
  <!-- ============================================================ -->
  <rect x="40" y="240" width="640" height="140" rx="2" ry="2"
        fill="#f2f2f2" stroke="#000000" stroke-width="1.0"/>
  <text x="60" y="260" font-size="11" font-weight="bold" fill="#000000">Processing Layer</text>

  <!-- Row 1 -->
  <rect x="60"  y="272" width="110" height="36" rx="2" ry="2"
        fill="#ffffff" stroke="#000000" stroke-width="1.0"/>
  <text x="115" y="295" font-size="9" text-anchor="middle" fill="#000000">Speech-to-Text</text>

  <rect x="195" y="272" width="115" height="36" rx="2" ry="2"
        fill="#ffffff" stroke="#000000" stroke-width="1.0"/>
  <text x="252" y="295" font-size="9" text-anchor="middle" fill="#000000">Query Processor</text>

  <rect x="335" y="272" width="110" height="36" rx="2" ry="2"
        fill="#ffffff" stroke="#000000" stroke-width="1.0"/>
  <text x="390" y="295" font-size="9" text-anchor="middle" fill="#000000">RAG Module</text>

  <!-- Row 2 -->
  <rect x="195" y="330" width="115" height="36" rx="2" ry="2"
        fill="#ffffff" stroke="#000000" stroke-width="1.0"/>
  <text x="252" y="353" font-size="9" text-anchor="middle" fill="#000000">Response Generator</text>

  <rect x="470" y="272" width="110" height="36" rx="2" ry="2"
        fill="#ffffff" stroke="#000000" stroke-width="1.0"/>
  <text x="525" y="295" font-size="9" text-anchor="middle" fill="#000000">Text-to-Speech</text>

  <!-- Internal pipeline arrows -->
  <!-- STT → Query Processor -->
  <line x1="170" y1="290" x2="195" y2="290" stroke="#000" stroke-width="1"/>
  <polygon points="195,290 187,286 187,294" fill="#000"/>

  <!-- Query Processor → RAG -->
  <line x1="310" y1="290" x2="335" y2="290" stroke="#000" stroke-width="1"/>
  <polygon points="335,290 327,286 327,294" fill="#000"/>

  <!-- RAG → Response Generator -->
  <line x1="390" y1="308" x2="390" y2="322" stroke="#000" stroke-width="1"/>
  <line x1="390" y1="322" x2="310" y2="340" stroke="#000" stroke-width="1"/>
  <polygon points="310,340 318,337 316,344" fill="#000"/>

  <!-- Response Generator → TTS -->
  <line x1="310" y1="348" x2="380" y2="348" stroke="#000" stroke-width="1"/>
  <line x1="380" y1="348" x2="470" y2="308" stroke="#000" stroke-width="1"/>
  <polygon points="470,308 462,307 464,314" fill="#000"/>

  <!-- ============================================================ -->
  <!-- ARROWS: Processing ↔ External Services                      -->
  <!-- ============================================================ -->
  <!-- RAG Module → LLM API (right-side vertical) -->
  <line x1="620" y1="290" x2="640" y2="290" stroke="#000" stroke-width="1"/>
  <line x1="640" y1="290" x2="640" y2="418" stroke="#000" stroke-width="1"/>
  <polygon points="640,418 636,410 644,410" fill="#000"/>

  <!-- STT / TTS ↔ Speech APIs (left-side vertical) -->
  <line x1="60" y1="308" x2="60" y2="418" stroke="#000" stroke-width="1"/>
  <polygon points="60,418 56,410 64,410" fill="#000"/>

  <!-- Label on left arrow -->
  <text x="68" y="370" font-size="7" fill="#555555" transform="rotate(-90,68,370)">Speech I/O</text>

  <!-- Label on right arrow -->
  <text x="648" y="360" font-size="7" fill="#555555" transform="rotate(-90,648,360)">LLM Queries</text>

  <!-- ============================================================ -->
  <!-- LAYER 4: EXTERNAL SERVICES  (y: 410–490)                    -->
  <!-- ============================================================ -->
  <rect x="40" y="410" width="640" height="82" rx="2" ry="2"
        fill="#e8e8e8" stroke="#000000" stroke-width="1.0"/>
  <text x="60" y="430" font-size="11" font-weight="bold" fill="#000000">External Services</text>

  <rect x="110" y="442" width="160" height="36" rx="2" ry="2"
        fill="#ffffff" stroke="#000000" stroke-width="1.0"/>
  <text x="190" y="465" font-size="10" text-anchor="middle" fill="#000000">Speech APIs</text>

  <rect x="440" y="442" width="160" height="36" rx="2" ry="2"
        fill="#ffffff" stroke="#000000" stroke-width="1.0"/>
  <text x="520" y="465" font-size="10" text-anchor="middle" fill="#000000">LLM API</text>

  <!-- ============================================================ -->
  <!-- ARROW: Processing → Data Storage (centre)                   -->
  <!-- ============================================================ -->
  <line x1="360" y1="380" x2="360" y2="530" stroke="#000" stroke-width="1"/>
  <polygon points="360,530 356,522 364,522" fill="#000"/>
  <text x="368" y="470" font-size="7" fill="#555555">Data Access</text>

  <!-- ============================================================ -->
  <!-- LAYER 5: DATA STORAGE  (y: 520–600)                         -->
  <!-- ============================================================ -->
  <rect x="40" y="522" width="640" height="82" rx="2" ry="2"
        fill="#f2f2f2" stroke="#000000" stroke-width="1.0"/>
  <text x="60" y="542" font-size="11" font-weight="bold" fill="#000000">Data Storage</text>

  <rect x="110" y="555" width="200" height="36" rx="2" ry="2"
        fill="#ffffff" stroke="#000000" stroke-width="1.0"/>
  <text x="210" y="578" font-size="10" text-anchor="middle" fill="#000000">FAQ Database</text>

  <rect x="400" y="555" width="220" height="36" rx="2" ry="2"
        fill="#ffffff" stroke="#000000" stroke-width="1.0"/>
  <text x="510" y="578" font-size="10" text-anchor="middle" fill="#000000">Vector Database (Embeddings)</text>

  <!-- ============================================================ -->
  <!-- FIGURE CAPTION                                               -->
  <!-- ============================================================ -->
  <text x="360" y="630" font-size="10" text-anchor="middle" fill="#000000"
        font-style="italic">Fig. 1.  System architecture of the LBS Voice Assistant.</text>

</svg>
